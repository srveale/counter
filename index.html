<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Calories</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #111111;
    --muted: #6b7280;
    --line: #e5e7eb;
    --field: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111111;
      --fg: #f5f5f5;
      --muted: #9ca3af;
      --line: #2e2e2e;
      --field: #1b1b1b;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px 48px;
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    max-width: 480px;
    margin-inline: auto;
  }
  h1 {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 8px;
  }
  #total {
    font-size: 64px;
    font-weight: 700;
    line-height: 1;
    margin: 0 0 4px;
    font-variant-numeric: tabular-nums;
  }
  form { display: flex; gap: 8px; margin: 0 0 16px; }
  input, button {
    font: inherit;
    border-radius: 10px;
    border: 1px solid var(--line);
    min-height: 52px;
  }
  input {
    flex: 1;
    width: 100%;
    padding: 0 14px;
    background: var(--field);
    color: var(--fg);
    font-size: 20px;
    font-variant-numeric: tabular-nums;
  }
  button {
    padding: 0 20px;
    background: var(--fg);
    color: var(--bg);
    border-color: var(--fg);
    font-weight: 600;
    cursor: pointer;
  }
  #reset {
    background: none;
    color: var(--muted);
    border-color: var(--line);
    width: 100%;
    font-weight: 400;
  }
  h2 {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 40px 0 8px;
  }
  ul { list-style: none; margin: 0; padding: 0; }
  li { border-bottom: 1px solid var(--line); }
  #empty, #avg-note { color: var(--muted); font-size: 14px; margin: 0; }
  #avg {
    font-size: 32px;
    font-weight: 700;
    margin: 0 0 2px;
    font-variant-numeric: tabular-nums;
  }
  .day {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 0 0 24px;
  }
  #day {
    min-height: 40px;
    padding: 0 10px;
    font-size: 15px;
    background: var(--field);
    color: var(--fg);
  }
  .link {
    min-height: 40px;
    padding: 0;
    background: none;
    border: 0;
    color: var(--muted);
    font-weight: 400;
    text-decoration: underline;
  }
  li button {
    display: flex;
    justify-content: space-between;
    width: 100%;
    min-height: 0;
    padding: 12px 0;
    background: none;
    border: 0;
    border-radius: 0;
    color: var(--fg);
    font-weight: 400;
    text-align: left;
    font-variant-numeric: tabular-nums;
  }
  li button span:first-child { color: var(--muted); }
  li button[aria-current="true"] span { font-weight: 700; color: var(--fg); }
</style>
</head>
<body>
  <h1 id="label">Today</h1>
  <p id="total">0</p>
  <div class="day">
    <input id="day" type="date" aria-label="Day">
    <button id="back" class="link" type="button" hidden>Back to today</button>
  </div>

  <form id="add">
    <input id="amount" type="number" inputmode="numeric" step="1" min="0" placeholder="Calories" required>
    <button type="submit">Add</button>
  </form>
  <button id="reset" type="button">Reset today</button>

  <h2>7-day average</h2>
  <p id="avg">—</p>
  <p id="avg-note"></p>

  <h2>Previous days</h2>
  <ul id="history"></ul>
  <p id="empty">Nothing yet.</p>

<script>
(function () {
  var KEY = 'calorie-counter';

  function dateKey(d) {
    return d.getFullYear() + '-' +
      String(d.getMonth() + 1).padStart(2, '0') + '-' +
      String(d.getDate()).padStart(2, '0');
  }

  function todayKey() { return dateKey(new Date()); }

  // Stored as { days: { "YYYY-MM-DD": total } }.
  function load() {
    var days = {};
    try {
      var saved = JSON.parse(localStorage.getItem(KEY) || 'null');
      if (saved && typeof saved === 'object') {
        if (saved.days && typeof saved.days === 'object') {
          Object.keys(saved.days).forEach(function (k) {
            days[k] = Number(saved.days[k]) || 0;
          });
        } else {
          // Older format: { date, total, history: [{ date, total }] }
          (Array.isArray(saved.history) ? saved.history : []).forEach(function (h) {
            if (h && typeof h.date === 'string' && !(h.date in days)) days[h.date] = Number(h.total) || 0;
          });
          if (typeof saved.date === 'string') days[saved.date] = Number(saved.total) || 0;
          save(days);
        }
      }
    } catch (e) { /* corrupt or unavailable storage: start fresh */ }
    return days;
  }

  function save(days) {
    try { localStorage.setItem(KEY, JSON.stringify({ days: days })); } catch (e) { /* ignore */ }
  }

  function formatDate(key) {
    var parts = key.split('-');
    var d = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
    return d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
  }

  var days = load();
  var selected = null; // null = today, so it follows midnight; otherwise a past "YYYY-MM-DD"

  var labelEl = document.getElementById('label');
  var totalEl = document.getElementById('total');
  var dayEl = document.getElementById('day');
  var backEl = document.getElementById('back');
  var resetEl = document.getElementById('reset');
  var historyEl = document.getElementById('history');
  var emptyEl = document.getElementById('empty');
  var avgEl = document.getElementById('avg');
  var avgNoteEl = document.getElementById('avg-note');
  var amountEl = document.getElementById('amount');

  function currentDay() { return selected || todayKey(); }

  function select(key) {
    selected = key && key < todayKey() ? key : null;
    render();
  }

  // Average of the 7 days before today. Today is still in progress, and
  // days with nothing logged are skipped rather than counted as zero.
  function weekAverage() {
    var sum = 0, logged = 0;
    for (var i = 1; i <= 7; i++) {
      var d = new Date();
      d.setDate(d.getDate() - i);
      var total = days[dateKey(d)];
      if (total > 0) { sum += total; logged++; }
    }
    return { value: logged ? Math.round(sum / logged) : null, logged: logged };
  }

  function render() {
    var today = todayKey();
    var day = currentDay();

    labelEl.textContent = selected ? formatDate(day) : 'Today';
    totalEl.textContent = days[day] || 0;
    dayEl.value = day;
    dayEl.max = today;
    backEl.hidden = !selected;
    resetEl.textContent = selected ? 'Reset this day' : 'Reset today';

    var avg = weekAverage();
    avgEl.textContent = avg.value === null ? '—' : avg.value;
    avgNoteEl.textContent = avg.logged === 0 ? 'Nothing logged in the past 7 days'
      : 'Past 7 days, not counting today' + (avg.logged < 7 ? ' · ' + avg.logged + ' of 7 logged' : '');

    var past = Object.keys(days).filter(function (k) { return k < today; }).sort().reverse();
    historyEl.innerHTML = '';
    past.forEach(function (key) {
      var li = document.createElement('li');
      var row = document.createElement('button');
      row.type = 'button';
      row.setAttribute('aria-current', key === selected ? 'true' : 'false');
      var d = document.createElement('span');
      d.textContent = formatDate(key);
      var t = document.createElement('span');
      t.textContent = days[key];
      row.appendChild(d);
      row.appendChild(t);
      row.addEventListener('click', function () {
        select(key);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
      li.appendChild(row);
      historyEl.appendChild(li);
    });
    emptyEl.hidden = past.length > 0;
  }

  dayEl.addEventListener('change', function () { select(dayEl.value); });
  backEl.addEventListener('click', function () { select(null); });

  document.getElementById('add').addEventListener('submit', function (e) {
    e.preventDefault();
    var n = Number(amountEl.value);
    if (!isFinite(n) || n === 0) return;
    var day = currentDay();
    days[day] = (days[day] || 0) + Math.round(n);
    save(days);
    render();
    amountEl.value = '';
    amountEl.blur();
  });

  resetEl.addEventListener('click', function () {
    delete days[currentDay()];
    save(days);
    render();
  });

  // Coming back to the tab after midnight should show the new day.
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) render();
  });

  render();
})();
</script>
</body>
</html>
